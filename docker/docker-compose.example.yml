# Docker Compose configuration for 3D Print Management System
# Copy this to docker-compose.yml and modify as needed

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: printdb
    environment:
      POSTGRES_DB: printdb
      POSTGRES_USER: printuser
      POSTGRES_PASSWORD: dev_password_change_in_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printuser -d printdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for background tasks
  redis:
    image: redis:7-alpine
    container_name: print_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Flask Backend API
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: print_backend
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://printuser:dev_password_change_in_production@db:5432/printdb  
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev_secret_key_change_in_production
      - MAIL_SERVER=smtp.office365.com
      - MAIL_PORT=587
      - MAIL_USE_TLS=true
      - MAIL_USERNAME=your_email@university.edu
      - MAIL_PASSWORD=your_email_password
      - STORAGE_BASE_PATH=/app/storage
    volumes:
      - ./backend:/app
      - ./storage:/app/storage  # Mount shared storage
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RQ Background Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: print_worker
    command: python -m rq worker --url redis://redis:6379/0
    environment:
      - DATABASE_URL=postgresql://printuser:dev_password_change_in_production@db:5432/printdb
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev_secret_key_change_in_production
      - MAIL_SERVER=smtp.office365.com
      - MAIL_PORT=587
      - MAIL_USE_TLS=true
      - MAIL_USERNAME=your_email@university.edu
      - MAIL_PASSWORD=your_email_password
      - STORAGE_BASE_PATH=/app/storage
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      - redis
      - db

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: print_frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000
      - NEXT_PUBLIC_ENVIRONMENT=development
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume for node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: print_management_network