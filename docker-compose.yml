# Docker Compose configuration for 3D Print Management System
# Development environment setup

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: printdb
    environment:
      POSTGRES_DB: printdb
      POSTGRES_USER: printuser
      POSTGRES_PASSWORD: dev_password_change_in_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printuser -d printdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for background tasks
  redis:
    image: redis:7-alpine
    container_name: print_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Flask Backend API
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: print_backend
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://printuser:dev_password_change_in_production@db:5432/printdb  
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev_secret_key_change_in_production
      - STORAGE_BASE_PATH=/app/storage
    volumes:
      - ./backend:/app
      - ./storage:/app/storage  # Mount shared storage
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python run.py

volumes:
  postgres_data:

networks:
  default:
    name: print_management_network